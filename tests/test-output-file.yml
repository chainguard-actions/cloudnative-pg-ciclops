name: Test output to file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture directory exists
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/passing-artifacts/"
      - id: action
        uses: .
        with:
          artifact_directory: tests/fixtures/passing-artifacts
          output_file: test-summary.md
      - name: Assert output file was created
        run: |
          echo "Checking for output file at: $GITHUB_WORKSPACE/test-summary.md"
          ls -la "$GITHUB_WORKSPACE/" | grep -E 'test-summary|\.md' || true
          if [ ! -f "$GITHUB_WORKSPACE/test-summary.md" ]; then
            echo "FAIL: expected output file $GITHUB_WORKSPACE/test-summary.md to exist"
            exit 1
          fi
          echo "PASS: output file exists"
      - name: Assert output file contains markdown content
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-summary.md")
          echo "content preview: ${CONTENT:0:300}"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          # Check for expected markdown sections
          if echo "$CONTENT" | grep -q "Overview"; then
            echo "PASS: output file contains Overview section"
          else
            echo "FAIL: output file does not contain expected Overview section"
            exit 1
          fi
      - name: Assert output file contains Thermometer section
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/test-summary.md")
          if echo "$CONTENT" | grep -q "Thermometer"; then
            echo "PASS: output file contains Thermometer section"
          else
            echo "FAIL: output file does not contain Thermometer section"
            exit 1
          fi
