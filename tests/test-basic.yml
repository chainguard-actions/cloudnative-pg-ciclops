name: Test basic usage with passing artifacts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          artifact_directory: tests/fixtures/passing-artifacts

      - name: Assert thermometer output is set
        env:
          THERMOMETER: ${{ steps.action.outputs.thermometer }}
        run: |
          echo "thermometer: $THERMOMETER"
          if [ -z "$THERMOMETER" ]; then
            echo "FAIL: thermometer output should not be empty"
            exit 1
          fi
          echo "PASS: thermometer is '$THERMOMETER'"

      - name: Assert alerts output key exists
        env:
          ALERTS: ${{ steps.action.outputs.alerts }}
        run: |
          echo "alerts: $ALERTS"
          echo "PASS: alerts output key is present (may be empty when all tests pass)"
