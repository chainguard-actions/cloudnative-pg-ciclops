name: Test writing report to output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifact directory with test data
        run: |
          mkdir -p test-artifacts
          cp $GITHUB_WORKSPACE/few-artifacts/*.json test-artifacts/

      - id: action
        uses: .
        with:
          artifact_directory: test-artifacts
          output_file: summary-report.md

      - name: Assert output file was created
        run: |
          echo "Checking for summary-report.md..."
          if [ ! -f "summary-report.md" ]; then
            echo "FAIL: expected output file 'summary-report.md' was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is non-empty
        run: |
          SIZE=$(wc -c < summary-report.md)
          echo "output file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: output file is empty"
            exit 1
          fi
          echo "PASS: output file has content"

      - name: Assert output file contains markdown
        run: |
          echo "File contents:"
          cat summary-report.md
          if ! grep -q "#" summary-report.md; then
            echo "FAIL: output file does not appear to contain markdown headings"
            exit 1
          fi
          echo "PASS: output file contains markdown"

      - name: Assert thermometer output is non-empty
        env:
          THERMOMETER: ${{ steps.action.outputs.thermometer }}
        run: |
          echo "thermometer: $THERMOMETER"
          if [ -z "$THERMOMETER" ]; then
            echo "FAIL: expected thermometer output to be non-empty"
            exit 1
          fi
          echo "PASS"
